name: Sync Production Dist

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-production-dist
  cancel-in-progress: true

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build production dist
        run: python3 build.py

      - name: Verify critical production files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/commercial-property-photography-melbourne/index.html
          test -f dist/construction-photography-melbourne/index.html
          test -f dist/work/lara-land-development-site-mapping/index.html
          test -f dist/work/cremorne-commercial-floor-plan/index.html
          test -f dist/work/williamstown-industrial-site-mapping/index.html
          test -f dist/work/maidstone-industrial-amenity-mapping/index.html
          python3 tests/verify_growthproof.py
          python3 tests/verify_index_hygiene.py

      - name: Commit generated dist if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist; then
            echo "dist is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "build: synchronize production dist"
          git push origin HEAD:main
