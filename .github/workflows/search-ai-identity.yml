name: Search AI Identity Commercial

on:
  push:
    branches:
      - growthproof/search-ai-identity-20260830
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-ai-identity-commercial
  cancel-in-progress: false

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-apply existing GrowthProof patch
        run: python3 scripts/apply_growthproof_measurement.py

      - name: Apply search, AI and legal identity patch
        run: python3 scripts/apply_search_ai_identity.py

      - name: Validate Python sources
        run: python3 -m py_compile build.py scripts/apply_growthproof_measurement.py scripts/apply_search_ai_identity.py tests/verify_growthproof.py

      - name: Build production dist
        run: python3 build.py

      - name: Validate built JavaScript
        run: node --check dist/assets/js/light.js

      - name: Run existing GrowthProof regression gates
        run: python3 tests/verify_growthproof.py

      - name: Search/AI identity assertions
        run: |
          grep -F 'SIXTH VISION PTY LTD' src/index.html
          grep -F 'ABN 92 625 744 630' src/index.html
          grep -F '"iso6523Code":"0151:92625744630"' src/index.html
          grep -F 'https://sixthvision.com.au/' src/index.html
          ! grep -F '"@type":"FAQPage"' src/index.html
          grep -F 'User-agent: *' static/robots.txt
          grep -F 'Allow: /' static/robots.txt

      - name: Diff hygiene
        run: git diff --check

      - name: Commit tested generated changes
        shell: bash
        run: |
          if git diff --quiet -- src/index.html src/js/light.js dist; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "418982678+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/js/light.js dist
          git commit -m "Apply commercial legal identity and AI-search hygiene"
          git push origin HEAD:${{ github.ref_name }}
