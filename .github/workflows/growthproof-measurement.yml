name: GrowthProof Measurement CI

on:
  push:
    branches:
      - growthproof/measurement-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growthproof-measurement-v1
  cancel-in-progress: false

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply idempotent GrowthProof source patch
        run: python3 scripts/apply_growthproof_measurement.py

      - name: Validate Python sources
        run: python3 -m py_compile build.py scripts/apply_growthproof_measurement.py tests/verify_growthproof.py

      - name: Build production dist
        run: python3 build.py

      - name: Validate built JavaScript syntax
        run: node --check dist/assets/js/light.js

      - name: Run GrowthProof regression gates
        run: python3 tests/verify_growthproof.py

      - name: Show exact branch diff
        run: git diff --check && git status --short

      - name: Commit tested generated changes to proof branch
        shell: bash
        run: |
          if git diff --quiet -- src/js/light.js dist; then
            echo "No generated source/build changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/light.js dist
          git commit -m "Implement GrowthProof CTA attribution and lead telemetry"
          git push origin HEAD:growthproof/measurement-v1
