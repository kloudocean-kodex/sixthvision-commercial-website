name: Production Edge Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-edge-smoke-commercial-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout risk registry
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages propagation
        run: sleep 60

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail

          check_absent() {
            local url="$1"
            local forbidden="$2"
            local body
            local code

            for attempt in {1..12}; do
              body="$(mktemp)"
              code="$(curl -L --connect-timeout 10 --max-time 25 -sS -o "$body" -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "200" ]] && ! grep -Fqi "$forbidden" "$body"; then
                echo "PASS $url -> forbidden marker absent: $forbidden"
                rm -f "$body"
                return 0
              fi
              echo "Attempt $attempt found forbidden marker or bad HTTP for $url; retrying..."
              rm -f "$body"
              sleep 15
            done

            echo "::error::Forbidden entity/spam marker remains on production: $forbidden"
            return 1
          }

          check_page() {
            local url="$1"
            local expect="$2"
            local body
            local code

            for attempt in {1..12}; do
              body="$(mktemp)"
              code="$(curl -L --connect-timeout 10 --max-time 25 -sS -o "$body" -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "200" ]] && grep -Fqi "$expect" "$body"; then
                echo "PASS $url -> HTTP $code with expected marker: $expect"
                rm -f "$body"
                return 0
              fi
              echo "Attempt $attempt failed for $url (HTTP ${code:-curl-error}); retrying..."
              rm -f "$body"
              sleep 15
            done

            echo "::error::Production route failed after retries: $url"
            return 1
          }

          check_status() {
            local url="$1"
            local wanted="$2"
            local code
            for attempt in {1..8}; do
              code="$(curl -L --connect-timeout 10 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "$wanted" ]]; then
                echo "PASS $url -> HTTP $code"
                return 0
              fi
              echo "Attempt $attempt failed for $url (HTTP ${code:-curl-error}); retrying..."
              sleep 15
            done
            echo "::error::Expected HTTP $wanted from $url"
            return 1
          }

          check_page "https://sixthvisioncommercial.com.au/" "Commercial Real Estate Photographer"
          check_page "https://sixthvisioncommercial.com.au/commercial-property-photography-melbourne/" "Commercial Property Photography Melbourne"
          check_page "https://sixthvisioncommercial.com.au/construction-photography-melbourne/" "Construction Photography Melbourne"
          check_page "https://sixthvisioncommercial.com.au/precision-floor-plans/" "Commercial Floor Plans Melbourne"
          check_page "https://sixthvisioncommercial.com.au/work/lara-land-development-site-mapping/" "Land & Development Site Mapping Lara"
          check_page "https://sixthvisioncommercial.com.au/sitemap.xml" "commercial-property-photography-melbourne"

          # Owner-verified Commercial operating claims must remain visible at the live edge.
          check_page "https://sixthvisioncommercial.com.au/commercial-property-photography-melbourne/" "1,000+"
          check_page "https://sixthvisioncommercial.com.au/commercial-property-photography-melbourne/" "CASA"
          check_page "https://sixthvisioncommercial.com.au/commercial-property-photography-melbourne/" "24-hour delivery is available for commercial photography"
          # The CBD marker is new in this change, so verify it only after the
          # branch reaches main. Pull-request runs intentionally probe the current
          # production edge, which cannot contain unmerged content yet.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            check_page "https://sixthvisioncommercial.com.au/commercial-property-photography-melbourne/" "CBD decision-makers. Metro-wide property coverage."
          fi

          # Every known hacked-index URL must remain a genuine 404. These exact
          # paths are kept in CI because GrowthProof/Search Console identified
          # them during the September 2026 cleanup. Do not redirect them into a
          # legitimate page; Google treats a real 404/410 as the permanent
          # removal signal for content with no replacement.
          while IFS= read -r spam_path || [[ -n "$spam_path" ]]; do
            [[ -z "$spam_path" || "$spam_path" == #* ]] && continue
            check_status "https://sixthvisioncommercial.com.au${spam_path}" "404"
          done < security/known-hacked-paths.txt

          # Canonical local-entity integrity and hacked-content fingerprints must
          # never leak into either valid homepage HTML or the canonical sitemap.
          for forbidden in             "ChIJreV6J7Bd1moR-Dzor5gAR2Y"             "318 Little Lonsdale"             "trinocasino"             "anabolika"             "pinco-onlayn-kazino"             "oyin-olamida-qiziqarli-imkoniyatlar"             "jedinstvene-strategije-koje-oaravaju-i-vode-do"
          do
            check_absent "https://sixthvisioncommercial.com.au/" "$forbidden"
            check_absent "https://sixthvisioncommercial.com.au/sitemap.xml" "$forbidden"
          done
