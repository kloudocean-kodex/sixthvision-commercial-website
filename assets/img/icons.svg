<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Sixth Vision Commercial — bespoke icon family.
     ONE spec, no exceptions: 24×24 box, 1.25 stroke, round cap, round join,
     no fills, geometry echoing the wordmark (flat sides, true diagonals).
     Twelve icons for the entire site. -->
<defs>
  <g id="i-base" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
</defs>

<!-- 01 · Aperture — photography -->
<symbol id="ic-aperture" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8.4"/><path d="M12 3.6 16.2 10.8M20.4 12 12 12M16.2 19.2 12 12M7.8 19.2 12 12M3.6 12 12 12M7.8 4.8 12 12"/>
</symbol>
<!-- 02 · Boundary — site mapping (the signature) -->
<symbol id="ic-boundary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 17.5 9 6.5 19.5 8.2 17 18Z"/><circle cx="4" cy="17.5" r="1.3"/><circle cx="9" cy="6.5" r="1.3"/><circle cx="19.5" cy="8.2" r="1.3"/><circle cx="17" cy="18" r="1.3"/>
</symbol>
<!-- 03 · Rotor — drone -->
<symbol id="ic-drone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <rect x="9.2" y="9.2" width="5.6" height="5.6" rx="1"/><path d="M9.2 9.2 5.6 5.6M14.8 9.2 18.4 5.6M9.2 14.8 5.6 18.4M14.8 14.8 18.4 18.4"/>
  <path d="M3 5.6h5.2M15.8 5.6H21M3 18.4h5.2M15.8 18.4H21"/>
</symbol>
<!-- 04 · Frame — cinematic film -->
<symbol id="ic-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2.8" y="5.5" width="18.4" height="13" rx="1.2"/><path d="M7.4 5.5v13M16.6 5.5v13M2.8 12h4.6M16.6 12h4.6"/>
</symbol>
<!-- 05 · Plan — floor plans -->
<symbol id="ic-plan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="1"/><path d="M3.2 10.4h8.2M11.4 3.2v17.6M11.4 15.6h9.4"/>
</symbol>
<!-- 06 · Dusk — day-to-dusk conversion -->
<symbol id="ic-dusk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2.6 17.4h18.8"/><path d="M6.6 17.4a5.4 5.4 0 0 1 10.8 0"/><path d="M12 4.2v2.2M4.9 7.3l1.6 1.6M19.1 7.3l-1.6 1.6M2.6 20.8h18.8"/>
</symbol>
<!-- 07 · Scale — measurement / area -->
<symbol id="ic-scale" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 8.5h18v7H3z"/><path d="M7 8.5v3M11 8.5v4.4M15 8.5v3M19 8.5v4.4"/>
</symbol>
<!-- 08 · Clock — 24 hour delivery -->
<symbol id="ic-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8.6"/><path d="M12 6.8V12l3.6 2.2"/>
</symbol>
<!-- 09 · Arrow — navigation / CTA -->
<symbol id="ic-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.5 12h15M13.6 6.1 19.5 12l-5.9 5.9"/>
</symbol>
<!-- 10 · Call -->
<symbol id="ic-call" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5.2 3.9h4l2 5-2.5 1.5a12.2 12.2 0 0 0 5 5L15.1 13l5 2v4a2 2 0 0 1-2 2A16.1 16.1 0 0 1 3.2 5.9a2 2 0 0 1 2-2Z"/>
</symbol>
<!-- 11 · Mail -->
<symbol id="ic-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2.8" y="5.2" width="18.4" height="13.6" rx="1.2"/><path d="m2.8 6.8 9.2 6.2 9.2-6.2"/>
</symbol>
<!-- 12 · Pin — service area -->
<symbol id="ic-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 21.2s7-5.3 7-11.2a7 7 0 1 0-14 0c0 5.9 7 11.2 7 11.2Z"/><circle cx="12" cy="9.8" r="2.6"/>
</symbol>
</svg>
